<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imperial Pack | Embalagens para todos os negócios</title>
  <meta name="description" content="Imperial Pack oferece embalagens para delivery, descartáveis, ecológicos e acessórios para negócios." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="#top" aria-label="Imperial Pack home">
        <img class="brand-logo" src="Public/Simbolo Isolado.png" alt="Imperial Pack" />
        <div class="brand-text"><strong>IMPERIAL <span>PACK</span></strong></div>
      </a>

      <button class="cart-button" id="cartButton" type="button" aria-label="Abrir carrinho">
        <img class="cart-icon" src="Public/icons8-shopping-cart-48.png" alt="" aria-hidden="true" />
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="top" class="page-shell">


    <section id="categorias" class="container categories-section">
      <nav class="categories" id="categories" aria-label="Categorias de produtos"></nav>
    </section>

    <section id="produtos" class="container products-section">
      <div class="section-heading"><h2>Produtos</h2></div>
      <div class="products-grid" id="productsGrid" aria-live="polite"></div>
    </section>
  </main>

  <aside class="cart-drawer" id="cartDrawer" aria-label="Carrinho de compras">
    <div class="cart-header">
      <h3>Seu carrinho</h3>
      <button type="button" class="close-cart" id="closeCart" aria-label="Fechar carrinho">×</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cartTotal">R$ 0,00</strong>
      </div>
      <button id="checkoutButton" type="button" class="checkout-button">Finalizar pedido pelo WhatsApp</button>
    </div>
  </aside>

  <div class="product-modal" id="productModal" hidden>
    <div class="product-modal-backdrop" data-close-product></div>
    <section class="product-modal-content" role="dialog" aria-modal="true" aria-labelledby="modalProductName">
      <button class="product-modal-close" type="button" data-close-product aria-label="Fechar detalhes">×</button>
      <img id="modalProductImage" class="modal-product-image" src="images/default-product.svg" alt="" />
      <div class="modal-product-body">
        <span id="modalProductCategory" class="product-category"></span>
        <h2 id="modalProductName"></h2>
        <p id="modalProductDescription"></p>
        <div class="modal-product-buy">
          <strong id="modalProductPrice"></strong>
          <span id="modalProductPresentation"></span>
        </div>
        <button id="modalAddToCart" class="add-to-cart modal-add-button" type="button">Adicionar ao carrinho</button>
      </div>
    </section>
  </div>

  <footer id="contato" class="site-footer">
    <div class="footer-bottom">
      <p>© 2026 Imperial Pack Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="catalogo.js"></script>
</body>
</html>
